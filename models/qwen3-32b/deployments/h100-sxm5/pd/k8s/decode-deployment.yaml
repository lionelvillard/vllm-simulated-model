apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-pd-525604-decode
  labels:
    app: vllm-qwen3-32b-pd-525604-decode
    role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b-pd-525604-decode
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b-pd-525604-decode
        role: decode
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3  # <-- verify/replace for your cluster
      # If your GPU nodes are tainted, uncomment and adjust:
      # tolerations:
      # - key: nvidia.com/gpu
      #   operator: Exists
      #   effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
        - vllm
        - serve
        - Qwen/Qwen3-32B
        args:
        - --served-model-name
        - qwen3-32b
        - --tokenizer
        - Qwen/Qwen3-32B
        - --tensor-parallel-size
        - "1"
        - --gpu-memory-utilization
        - "0.9"
        - --max-model-len
        - "8192"
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
        env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5601"
        - name: UCX_NET_DEVICES
          value: all
        - name: HF_HOME
          value: /tmp/hf
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 5601
          name: nixl-side
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 600
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 600
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            memory: 32Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: hf-cache
          mountPath: /tmp/hf
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: hf-cache
        emptyDir:
          sizeLimit: 80Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
