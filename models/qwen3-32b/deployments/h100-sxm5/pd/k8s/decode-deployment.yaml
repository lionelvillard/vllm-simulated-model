apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-pd-eae748-decode
  labels:
    app: vllm-qwen3-32b-pd-eae748-decode
    role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b-pd-eae748-decode
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b-pd-eae748-decode
        role: decode
    spec:
      initContainers:
      # Copy pre-built dependencies (plugin + nixl) from deps image
      # See docker/vllm-sim-deps/README.md for version compatibility
      - name: install-deps
        image: ghcr.io/lionelvillard/vllm-sim-deps:v0.1.0
        command:
        - sh
        - -c
        - |
          cp -r /plugins/* /mnt/plugins/
          cp -r /nixl-deps/* /mnt/nixl-deps/
        volumeMounts:
        - name: plugins
          mountPath: /mnt/plugins
        - name: nixl-deps
          mountPath: /mnt/nixl-deps
      containers:
      # llm-d sidecar for P/D disaggregation coordination
      - name: sidecar
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:latest
        args:
        - --kv-connector=nixlv2
        - --port=8000
        - --secure-proxy=false
        env:
        - name: PREFILLER_HOST
          value: vllm-qwen3-32b-pd-eae748-prefill:8000
        - name: DECODER_HOST
          value: localhost:8200
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: vllm
        image: vllm/vllm-openai-cpu:latest-x86_64
        command:
        - vllm
        - serve
        - /model
        - --load-format=dummy
        - --max-model-len=8192
        - --tokenizer=Qwen/Qwen3-32B
        - --served-model-name=qwen3-32b
        - --gpu-memory-utilization=0.5
        - --port=8200
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
        env:
        - name: PYTHONPATH
          value: /plugins:/nixl-deps
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-3"
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5601"
        - name: UCX_NET_DEVICES
          value: all
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: HF_HOME
          value: /tmp/hf
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8200
          name: vllm
        - containerPort: 5601
          name: nixl-side
        startupProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: nixl-deps
          mountPath: /nixl-deps
        - name: model-config
          mountPath: /model
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /tmp/hf
      volumes:
      - name: plugins
        emptyDir: {}
      - name: nixl-deps
        emptyDir: {}
      - name: model-config
        configMap:
          name: vllm-qwen3-32b-pd-eae748-config
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: hf-cache
        emptyDir:
          sizeLimit: 8Gi
