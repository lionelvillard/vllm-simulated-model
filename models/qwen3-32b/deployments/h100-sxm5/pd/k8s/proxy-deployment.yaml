apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-pd-eae748-proxy
  labels:
    app: vllm-qwen3-32b-pd-eae748-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b-pd-eae748-proxy
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b-pd-eae748-proxy
    spec:
      # Wait for both vLLM instances to become ready before starting the proxy.
      # The disagg_proxy_demo.py validates the model on both backends at startup.
      initContainers:
      - name: wait-for-prefill
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until wget -qO- http://vllm-qwen3-32b-pd-eae748-prefill:8000/health > /dev/null 2>&1; do
            echo "waiting for prefill..."; sleep 5
          done
      - name: wait-for-decode
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until wget -qO- http://vllm-qwen3-32b-pd-eae748-decode:8000/health > /dev/null 2>&1; do
            echo "waiting for decode..."; sleep 5
          done
      - name: create-patched-proxy
        image: vllm/vllm-openai:latest
        command:
        - sh
        - -c
        - |
          # Copy the original script and remove the IP address validation
          cp /vllm-workspace/examples/disaggregated/disaggregated_serving/disagg_proxy_demo.py /scripts/disagg_proxy_demo.py
          # Patch: skip IP validation for non-localhost hosts (allow hostnames)
          sed -i '/if host != "localhost":/,/ipaddress.ip_address(host)/c\            # IP validation removed to support Kubernetes DNS names' /scripts/disagg_proxy_demo.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      containers:
      - name: proxy
        image: vllm/vllm-openai:latest
        command:
        - python3
        - /scripts/disagg_proxy_demo.py
        args:
        - --model
        - qwen3-32b
        - --prefill
        - vllm-qwen3-32b-pd-eae748-prefill:8000
        - --decode
        - vllm-qwen3-32b-pd-eae748-decode:8000
        - --port
        - "8000"
        env:
        - name: HOME
          value: /tmp
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /status
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        emptyDir: {}
