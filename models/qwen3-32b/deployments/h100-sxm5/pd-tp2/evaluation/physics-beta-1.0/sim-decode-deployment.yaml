apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-pd-tp2-d960e4-sim-decode
  labels:
    app: vllm-qwen3-32b-pd-tp2-d960e4-sim-decode
    role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b-pd-tp2-d960e4-sim-decode
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b-pd-tp2-d960e4-sim-decode
        role: decode
    spec:
      initContainers:
      - name: install-plugin
        image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - cp -r /plugins/* /mnt/plugins/
        volumeMounts:
        - name: plugins
          mountPath: /mnt/plugins
      containers:
      - name: sidecar
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:latest
        imagePullPolicy: Always
        args:
        - --kv-connector=nixlv2
        - --port=8000
        - --secure-proxy=false
        env:
        - name: PREFILLER_HOST
          value: vllm-qwen3-32b-pd-tp2-d960e4-sim-prefill:8000
        - name: DECODER_HOST
          value: localhost:8200
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: vllm
        image: vllm/vllm-openai-cpu:v0.27.0-x86_64
        command:
        - vllm
        - serve
        - /model
        - --load-format=dummy
        - --max-model-len=16384
        - --tokenizer=Qwen/Qwen3-32B
        - --served-model-name=qwen3-32b
        - --gpu-memory-utilization=0.5
        - --tensor-parallel-size=2
        - --port=8200
        - --kv-transfer-config
        - '{"kv_connector":"SimulatedNixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bandwidth_gbps":100,"handshake_ms":2}}'
        env:
        - name: PYTHONPATH
          value: /plugins
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-7"
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5601"
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8200
          name: vllm
        - containerPort: 5601
          name: nixl-side
        startupProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8200
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
          limits:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: model-config
          mountPath: /model
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: plugins
        emptyDir: {}
      - name: model-config
        configMap:
          name: vllm-qwen3-32b-pd-tp2-d960e4-config
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
