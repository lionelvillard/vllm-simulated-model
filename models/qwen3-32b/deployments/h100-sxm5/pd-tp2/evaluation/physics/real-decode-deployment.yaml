apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b-pd-tp2-fcb0d4-real-decode
  labels:
    app: vllm-qwen3-32b-pd-tp2-fcb0d4-real-decode
    role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen3-32b-pd-tp2-fcb0d4-real-decode
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b-pd-tp2-fcb0d4-real-decode
        role: decode
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3  # <-- verify/replace for your cluster
      containers:
      - name: sidecar
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:latest
        imagePullPolicy: Always
        args:
        - --kv-connector=nixlv2
        - --port=8000
        - --secure-proxy=false
        env:
        - name: PREFILLER_HOST
          value: vllm-qwen3-32b-pd-tp2-fcb0d4-real-prefill:8000
        - name: DECODER_HOST
          value: localhost:8200
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
        - vllm
        - serve
        - Qwen/Qwen3-32B
        args:
        - --served-model-name
        - qwen3-32b
        - --tokenizer
        - Qwen/Qwen3-32B
        - --tensor-parallel-size
        - "2"
        - --gpu-memory-utilization
        - "0.9"
        - --max-model-len
        - "8192"
        - --port
        - "8200"
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
        env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5601"
        - name: HF_HOME
          value: /tmp/hf
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8200
          name: vllm
        - containerPort: 5601
          name: nixl-side
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 600
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 600
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: 64Gi
            nvidia.com/gpu: 2
          limits:
            memory: 64Gi
            nvidia.com/gpu: 2
        volumeMounts:
        - name: hf-cache
          mountPath: /tmp/hf
      volumes:
      - name: hf-cache
        emptyDir:
          sizeLimit: 80Gi
