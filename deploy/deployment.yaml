apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  labels:
    app: vllm-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
    spec:
      initContainers:
      - name: install-plugin
        image: python:3.12-slim
        command:
        - pip
        - install
        - --target=/plugins
        - --no-deps
        - git+https://github.com/vllm-project/vllm-simulated-model.git@main
        volumeMounts:
        - name: plugins
          mountPath: /plugins
      containers:
      - name: vllm
        image: vllm/vllm-openai-cpu:latest-x86_64
        command:
        - vllm
        - serve
        - /model
        - --load-format=dummy
        - --device=cpu
        - --skip-tokenizer-init
        - --gpu-memory-utilization=0.5
        env:
        - name: PYTHONPATH
          value: /plugins
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-3"
        ports:
        - containerPort: 8000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: model-config
          mountPath: /model
          readOnly: true
      volumes:
      - name: plugins
        emptyDir: {}
      - name: model-config
        configMap:
          name: vllm-sim-model-config
